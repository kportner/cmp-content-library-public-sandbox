{% load i18n %}
<div class="btn-toolbar gap-2 mb-3">
    {% if openshift_ci %}
    <a class="open-dialog btn btn-light" href="{% url 'edit_openshift_credentials' %}">
        <span class="icon-edit"></span>
        Edit Credentials
    </a>
    <a class="btn btn-light open-dialog" href="{% url 'verify_openshift_credentials' %}">
        <span class="icon-verify-connection"></span>
        Verify Connection
    </a>
    <a class="btn btn-light open-dialog" href="{% url 'delete_openshift_credentials' %}">
        <span class="icon-delete"></span>
        Delete Credentials
    </a>
    {% else %}
    <a class="open-dialog btn btn-light" href="{% url 'add_openshift_credentials' %}">
        <span class="icon-add"></span>
        Add Credentials
    </a>
    {% endif %}
</div>
{% if openshift_ci %}
<div class="card cb-surface-card">
    <div class="card-body pt-4">
        <dl>
            <dt>{% trans "URL" %}:</dt>
            <dd>{{ openshift_ci.protocol }}://{{ openshift_ci.ip }}:{{ openshift_ci.port }}</dd>
        </dl>
    </div>
</div>
{% endif %}
