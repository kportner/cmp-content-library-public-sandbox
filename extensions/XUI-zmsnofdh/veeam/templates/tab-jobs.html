{% load i18n %}
<div class="card cb-surface-card">
    <div class="card-body pt-4">
        <table class="table table-hover" style="width:100%">
            <thead>
            <tr>
                <th>Job Name</th>
                <th>Job ID</th>
            </tr>
            </thead>
            <tbody>
                {% for job in jobs %}
                <tr>
                    <td>{{ job.name }}</td>
                    <td>{{ job.id }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
